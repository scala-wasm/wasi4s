name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SBT_OPTS: -Dsbt.server.autostart=false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime,wac-cli,wasm-tools

      - name: Install wit-bindgen-scala
        run: cargo install wit-bindgen-scala --version 0.1.0 --locked

      - name: Check generated bindings are up to date
        run: ./scripts/regenerate.sh --check

      - name: Compile
        run: sbt "+wasip2/compile"

      - name: Run WASI smoke tests
        run: sbt "+tests/testFull"

      - name: Publish
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
